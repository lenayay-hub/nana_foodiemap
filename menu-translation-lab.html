<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>菜單翻譯實驗室 | Nana</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#203e34;background:#f6f7f2}*{box-sizing:border-box}body{margin:0}.wrap{max-width:640px;margin:auto;padding:24px 18px 60px}h1{font-family:serif;font-size:27px;margin:12px 0}p{line-height:1.65;color:#66776f;font-size:14px}.card{background:white;border:1px solid #e0e7dd;border-radius:20px;padding:17px;margin-top:15px;box-shadow:0 5px 22px #1a473209}.tag{font-size:11px;color:#4b826c;letter-spacing:1px}.btn{border:0;border-radius:12px;background:#254e3e;color:white;padding:13px 17px;font-weight:700;font-size:14px;cursor:pointer}.btn:disabled{opacity:.5}.secondary{background:#e8efe9;color:#234536}.buttons{display:flex;gap:9px;flex-wrap:wrap}.buttons>*{flex:1}input[type=file]{display:none}label.upload{display:block;text-align:center;padding:22px;border:1px dashed #8da89a;border-radius:15px;cursor:pointer;background:#f8faf6}select{width:100%;padding:11px;border-radius:10px;border:1px solid #ccd8cf;background:white}#preview{max-width:100%;border-radius:12px;display:none;margin-top:14px}pre{white-space:pre-wrap;word-break:break-word;background:#f7f8f5;padding:12px;border-radius:10px;font-size:12px;max-height:250px;overflow:auto}small{color:#728079}#status{font-size:13px;color:#2b6650;margin-top:10px}#results{display:grid;gap:12px}.result{border:1px solid #e3e8e0;border-radius:12px;padding:12px}.result strong{display:block;font-size:12px;margin-bottom:6px}a{color:#23654e}.notice{border-left:3px solid #c3a369;padding-left:12px}</style></head>
<body><main class="wrap"><div class="tag">NANA · EXPERIMENT 01</div><h1>菜單翻譯實驗室 🌿</h1><p>獨立測試頁，不會改動 Nana Foodie Map 正式字典、收藏或掃描功能。照片只在手機瀏覽器內處理。</p>
<section class="card"><b>① 選擇菜單照片</b><p>建議先用 iPhone 相簿裁掉社群按鈕與狀態列。</p><label class="upload">📷 點此拍照或選擇照片<input id="file" type="file" accept="image/*"></label><img id="preview" alt="菜單預覽"></section>
<section class="card"><b>② 比較辨識方式</b><p>同一張照片分別用越南文＋英文，以及純英文 OCR，檢查原始辨識結果。</p><div class="buttons"><button class="btn" id="vie" disabled>越南文＋英文</button><button class="btn secondary" id="eng" disabled>純英文</button></div><div id="status" role="status">等待選擇照片</div><div id="results"></div></section>
<section class="card"><b>③ 翻譯實驗</b><p>嘗試瀏覽器內建翻譯（需瀏覽器支援）；不支援時，可複製文字或手動開啟免費翻譯工具。這一頁不使用付費 API。</p><div class="buttons"><button class="btn secondary" id="translate" disabled>試用裝置端翻譯</button><button class="btn secondary" id="copy" disabled>複製 OCR 原文</button></div><div id="translation"></div><p class="notice">實驗版會明確顯示 OCR 與翻譯是否成功，不會把猜測的食材當作確定結果。</p></section>
</main><script>
const $=id=>document.getElementById(id);let file=null,worker=null,lang='',lastText='',url=null;
$('file').onchange=e=>{file=e.target.files[0];if(!file)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(file);$('preview').src=url;$('preview').style.display='block';$('vie').disabled=false;$('eng').disabled=false;$('translate').disabled=true;$('copy').disabled=true;$('results').replaceChildren();$('translation').replaceChildren();$('status').textContent='照片已選好，請選擇辨識模式';};
async function loadTesseract(){if(window.Tesseract)return window.Tesseract;return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';s.onload=()=>window.Tesseract?resolve(window.Tesseract):reject(Error('OCR 載入失敗'));s.onerror=()=>reject(Error('OCR 套件下載失敗，請確認網路'));document.head.append(s);});}
async function scan(mode){if(!file)return;for(const id of ['vie','eng'])$(id).disabled=true;$('status').textContent='下載或執行 OCR 中，第一次可能需要較久…';try{const T=await loadTesseract();if(!worker||lang!==mode){if(worker)await worker.terminate();worker=await T.createWorker(mode,1,{logger:m=>{if(m.status==='recognizing text')$('status').textContent='辨識中 '+Math.round((m.progress||0)*100)+'%';}});lang=mode;}const data=(await worker.recognize(file)).data;lastText=(data.text||'').trim();const block=document.createElement('div');block.className='result';const title=document.createElement('strong');title.textContent=mode==='vie+eng'?'越南文＋英文':'純英文';const pre=document.createElement('pre');pre.textContent=lastText||'沒有辨識到文字';block.append(title,pre);$('results').prepend(block);$('status').textContent='完成：'+(lastText?'已辨識到文字':'沒有辨識到文字');$('translate').disabled=!lastText;$('copy').disabled=!lastText;}catch(err){$('status').textContent='辨識失敗：'+(err.message||String(err));}finally{$('vie').disabled=false;$('eng').disabled=false;}}
$('vie').onclick=()=>scan('vie+eng');$('eng').onclick=()=>scan('eng');
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(lastText);$('status').textContent='已複製 OCR 原文';}catch(e){$('status').textContent='複製失敗，請長按上方文字複製';}};
$('translate').onclick=async()=>{const el=$('translation');el.replaceChildren();try{if(!('Translator' in self))throw Error('這個 Safari 版本沒有提供可用的網頁端翻譯介面');const availability=await Translator.availability({sourceLanguage:'vi',targetLanguage:'zh'});if(availability==='unavailable')throw Error('裝置端越南文翻譯不可用');const translator=await Translator.create({sourceLanguage:'vi',targetLanguage:'zh'});const output=await translator.translate(lastText);const pre=document.createElement('pre');pre.textContent=output;el.append(pre);}catch(e){const p=document.createElement('p');p.textContent='無法使用裝置端翻譯：'+e.message;const a=document.createElement('a');a.href='https://translate.google.com/?sl=vi&tl=zh-TW&text='+encodeURIComponent(lastText)+'&op=translate';a.target='_blank';a.rel='noopener noreferrer';a.textContent='用 Google 翻譯查看這段文字';el.append(p,a);}};
</script></body></html>
