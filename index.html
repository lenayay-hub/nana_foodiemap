                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      {CardComp && allSavedPlaces.slice(0, 3).map(item => (
                        <CardComp
                          key={item.uid}
                          item={item}
                          onUpdateNote={handleUpdateNote}
                          onUpdateCategory={handleUpdateCategory}
                          onDelete={handleDeleteItem}
                          onAddToTrip={handleQuickAddPlaceToTrip}
                        />
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* ⭐ 分頁 2：收藏 */}
            {activeTab === 'saved' && (
              <div className="space-y-5 animate-fade-in">
                <div className="flex flex-col sm:flex-row sm:items-end justify-between gap-3">
                  <div>
                    <p className="text-[11px] font-bold uppercase tracking-widest text-accent">SAVED PLACES & RESTAURANTS</p>
                    <h1 className="text-2xl font-serif font-bold text-deep mt-0.5">⭐ 娜娜的景點與餐廳收藏庫</h1>
                    <p className="text-xs text-muted mt-1">LINE 傳送貼文網址或截圖自動分類收錄，AI 必點招牌與門票資訊皆已整合於卡片備註中。</p>
                  </div>
                  <div className="flex gap-1.5 bg-white p-1 rounded-2xl border border-line self-start">
                    {[
                      ['all', `全部 (${allSavedPlaces.length})`],
                      ['food', `🍽️ 餐廳 (${db.food.length})`],
                      ['spot', `📸 景點 (${db.spot.length})`]
                    ].map(([k, label]) => (
                      <button
                        key={k}
                        onClick={() => { setSavedFilterType(k); setSelectedCategory(''); }}
                        className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all ${savedFilterType === k ? 'bg-deep text-white shadow-sm' : 'text-muted hover:text-ink'}`}
                      >
                        {label}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="editorial-card p-4 grid grid-cols-1 sm:grid-cols-12 gap-3 items-center">
                  <div className="sm:col-span-5 relative">
                    <input
                      type="text"
                      placeholder="🔍 搜尋店名、景點、地址或必點招牌備註..."
                      value={searchKeyword}
                      onChange={e => setSearchKeyword(e.target.value)}
                      className="w-full bg-paper border border-line rounded-xl px-3.5 py-2.5 text-xs text-ink pr-8"
                    />
                    {searchKeyword && (
                      <button
                        onClick={() => setSearchKeyword('')}
                        className="absolute right-2.5 top-1/2 -translate-y-1/2 text-xs text-muted hover:text-deep font-bold"
                        title="清除搜尋"
                      >
                        ✕
                      </button>
                    )}
                  </div>
                  <div className="sm:col-span-3">
                    <select
                      value={selectedCity}
                      onChange={e => setSelectedCity(e.target.value)}
                      className="w-full bg-paper border border-line rounded-xl px-3 py-2.5 text-xs text-ink font-semibold"
                    >
                      <option value="">📍 全部縣市地區</option>
                      {availableCities.map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                  </div>
                  <div className="sm:col-span-2">
                    <select
                      value={selectedCategory}
                      onChange={e => setSelectedCategory(e.target.value)}
                      className="w-full bg-paper border border-line rounded-xl px-3 py-2.5 text-xs text-ink font-semibold"
                    >
                      <option value="">🏷️ 全部分類</option>
                      {currentCategoryOptions.map((c, idx) => (
                        <option key={`${c.name}_${idx}`} value={c.name}>{c.name} {c.emoji}</option>
                      ))}
                    </select>
                  </div>
                  <div className="sm:col-span-2">
                    <button
                      onClick={() => setOnlyOpenNow(!onlyOpenNow)}
                      className={`w-full py-2.5 rounded-xl text-xs font-bold border transition-colors ${onlyOpenNow ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-paper text-muted border-line'}`}
                    >
                      🕒 營業中
                    </button>
                  </div>
                </div>

                {filteredSavedPlaces.length === 0 ? (
                  <div className="editorial-card p-12 text-center space-y-3">
                    <p className="text-sm font-bold text-deep">沒有找到符合條件的收藏地點</p>
                    <p className="text-xs text-muted">你可以調整篩選條件，或將社群貼文傳給 LINE 機器人自動辨識收錄！</p>
                    {searchKeyword && (
                      <button onClick={() => setSearchKeyword('')} className="bg-deep text-white text-xs font-bold px-4 py-2 rounded-xl">
                        顯示全部收藏
                      </button>
                    )}
                  </div>
                ) : (
                  <div className="space-y-6">
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                      {CardComp && filteredSavedPlaces.slice(0, visibleCount).map(item => (
                        <CardComp
                          key={item.uid}
                          item={item}
                          onUpdateNote={handleUpdateNote}
                          onUpdateCategory={handleUpdateCategory}
                          onDelete={handleDeleteItem}
                          onAddToTrip={handleQuickAddPlaceToTrip}
                        />
                      ))}
                    </div>

                    {visibleCount < filteredSavedPlaces.length && (
                      <div className="text-center pt-2">
                        <button
                          onClick={() => setVisibleCount(prev => prev + 12)}
                          className="bg-white hover:bg-soft text-deep font-bold text-xs px-6 py-3 rounded-2xl border border-line shadow-sm transition-colors"
                        >
                          👇 載入更多收藏（目前顯示 {visibleCount} / 共 {filteredSavedPlaces.length} 筆）
                        </button>
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}

            {/* ➕ 分頁 3：建立新行程 */}
            {activeTab === 'createTrip' && (
              <div className="max-w-2xl mx-auto animate-fade-in">
                <form onSubmit={handleCreateNewTrip} className="editorial-card p-6 sm:p-8 space-y-5">
                  <div>
                    <p className="text-[11px] font-bold uppercase tracking-widest text-accent">CREATE NEW ITINERARY</p>
                    <h1 className="text-2xl font-serif font-bold text-deep mt-1">➕ 建立新旅程 & 匯入收藏景點</h1>
                    <p className="text-xs text-muted mt-1">建立後會自動同步備份至你的 Google 試算表，並將勾選的收藏地點（含 AI 必點備註）帶入行程表。</p>
                  </div>

                  <div className="space-y-4 text-xs">
                    <div>
                      <label className="font-bold text-deep block mb-1.5">旅程名稱 *</label>
                      <input
                        type="text"
                        placeholder="例如：台南美食三天兩夜、東京賞櫻自由行"
                        value={newTripTitle}
                        onChange={e => setNewTripTitle(e.target.value)}
                        className="w-full bg-paper border border-line rounded-xl px-4 py-3 text-sm text-ink font-semibold"
                        required
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="font-bold text-deep block mb-1.5">出發日期 *</label>
                        <input
                          type="date"
                          value={newTripStart}
                          onChange={e => setNewTripStart(e.target.value)}
                          className="w-full bg-paper border border-line rounded-xl px-3.5 py-2.5 text-ink"
                          required
                        />
                      </div>
                      <div>
                        <label className="font-bold text-deep block mb-1.5">旅行天數 *</label>
                        <input
                          type="number"
                          min="1"
                          max="60"
                          value={newTripDays}
                          onChange={e => setNewTripDays(e.target.value)}
                          className="w-full bg-paper border border-line rounded-xl px-3.5 py-2.5 text-ink"
                          required
                        />
                      </div>
                    </div>

                    <div>
                      <label className="font-bold text-deep block mb-1.5">同行旅伴名單（一行一位，用於分帳計算）</label>
                      <textarea
                        rows="2"
                        value={newTripMembers}
                        onChange={e => setNewTripMembers(e.target.value)}
                        className="w-full bg-paper border border-line rounded-xl p-3 text-ink"
                      />
                    </div>

                    <div className="pt-2">
                      <div className="flex items-center justify-between mb-2">
                        <label className="font-bold text-deep text-sm">⭐ 勾選要帶入這趟旅程的收藏 ({newTripPickedIds.length} 個已選)</label>
                      </div>
                      <input
                        type="text"
                        placeholder="🔍 篩選收藏的餐廳、景點或縣市..."
                        value={newTripFilter}
                        onChange={e => setNewTripFilter(e.target.value)}
                        className="w-full bg-paper border border-line rounded-xl px-3.5 py-2 mb-2.5 text-ink"
                      />

                      <div className="max-h-72 overflow-y-auto space-y-2 border border-line rounded-2xl p-3 bg-paper/50">
                        {allSavedPlaces.length === 0 ? (
                          <div className="text-center py-6 text-muted">目前收藏庫還是空的，可先建立空白旅程，之後再隨時加入景點！</div>
                        ) : (
                          allSavedPlaces
                            .filter(p => `${p.name} ${p.city} ${p.foodType}`.toLowerCase().includes(newTripFilter.toLowerCase()))
                            .map(p => {
                              const checked = newTripPickedIds.includes(p.uid);
                              return (
                                <label key={p.uid} className={`flex items-start gap-3 p-3 rounded-xl border cursor-pointer transition-colors ${checked ? 'bg-soft border-accent' : 'bg-white border-line'}`}>
                                  <input
                                    type="checkbox"
                                    checked={checked}
                                    onChange={e => {
                                      if (e.target.checked) setNewTripPickedIds([...newTripPickedIds, p.uid]);
                                      else setNewTripPickedIds(newTripPickedIds.filter(id => id !== p.uid));
                                    }}
                                    className="mt-1"
                                  />
                                  <div className="flex-1 min-w-0">
                                    <div className="flex items-center gap-1.5">
                                      <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-paper border border-line">
                                        {p.sourceTab === 'food' ? '🍽️ 餐廳' : '📸 景點'}
                                      </span>
                                      <strong className="text-xs font-bold text-deep truncate">{p.name}</strong>
                                      <span className="text-[11px] text-muted">({p.city || '未分類'})</span>
                                    </div>
                                    {p.combinedNote && <p className="text-[11px] text-muted truncate mt-0.5">{p.combinedNote}</p>}
                                  </div>
                                </label>
                              );
                            })
                        )}
                      </div>
                    </div>
                  </div>

                  <button type="submit" className="w-full py-3.5 rounded-2xl bg-deep hover:bg-accent text-white font-bold text-sm shadow-lg transition-colors">
                    ✨ 立即建立旅程並開始排程
                  </button>
                </form>
              </div>
            )}

            {/* 🗓️ 分頁 4：行程 */}
            {activeTab === 'trips' && (
              <div className="animate-fade-in">
                {activeTripObj && TripComp ? (
                  <TripComp
                    trip={activeTripObj}
                    allSavedPlaces={allSavedPlaces}
                    onUpdateTrip={(updated) => {
                      const next = trips.map(t => t.id === updated.id ? updated : t);
                      syncTripsToCloud(next);
                    }}
                    onBack={() => setActiveTripId(null)}
                    onJumpToSaved={handleJumpToSavedPlace}
                    showToast={showToast}
                  />
                ) : (
                  <div className="space-y-5">
                    <div className="flex items-end justify-between gap-3 flex-wrap">
                      <div>
                        <p className="text-[11px] font-bold uppercase tracking-widest text-accent">MY TRAVEL ITINERARIES</p>
                        <h1 className="text-2xl font-serif font-bold text-deep mt-0.5">🗓️ 娜娜的旅程規劃簿</h1>
                        <p className="text-xs text-muted mt-1">所有行程皆自動同步備份於 Google 試算表，點入即可編輯時間軸、航班、交通與一鍵匯出漂亮行程表。</p>
                      </div>
                      <button onClick={() => setActiveTab('createTrip')} className="bg-accent text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow">
                        ➕ 新增一趟旅程
                      </button>
                    </div>

                    {trips.length === 0 ? (
                      <div className="editorial-card p-12 text-center space-y-3">
                        <p className="text-base font-bold text-deep">目前還沒有任何行程紀錄</p>
                        <p className="text-xs text-muted">點擊下方中間的「➕ 新行程」按鈕，把收藏的餐廳與景點排成一趟旅行吧！</p>
                        <button onClick={() => setActiveTab('createTrip')} className="bg-deep text-white text-xs font-bold px-5 py-2.5 rounded-xl mt-2">
                          ➕ 立即建立第一趟行程
                        </button>
                      </div>
                    ) : (
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {trips.map(t => {
                          const evCost = (t.events || []).reduce((acc, ev) => acc + (Number(ev.cost) || 0) + (Number(ev.transitToNext?.cost) || 0), 0);
                          const expCost = (t.expenses || []).reduce((a, e) => a + Number(e.twd || 0), 0);
                          const totalCost = evCost + expCost;
                          return (
                            <div key={t.id} className="editorial-card p-5 flex flex-col justify-between space-y-4 hover:border-accent transition-colors">
                              <div>
                                <div className="flex items-center justify-between text-xs text-muted mb-1">
                                  <span className="font-bold text-accent">📅 {t.start} 出發 · {t.days} 天</span>
                                  <button
                                    onClick={() => {
                                      if (confirm(`確定要刪除「${t.title}」這趟行程嗎？`)) {
                                        syncTripsToCloud(trips.filter(x => x.id !== t.id));
                                        showToast('🗑️ 已刪除行程');
                                      }
                                    }}
                                    className="text-gray-400 hover:text-red-500"
                                  >
                                    刪除 ✕
                                  </button>
                                </div>
                                <h3 className="text-xl font-serif font-bold text-deep">{t.title}</h3>
                                <p className="text-xs text-muted mt-1">
                                  📍 {(t.places || []).length} 個地點 · 🗓️ {(t.events || []).length} 個排程項目 · 💰 預估總花費 NT$ {totalCost.toLocaleString()}
                                </p>
                              </div>
                              <div className="flex items-center justify-between pt-3 border-t border-line">
                                <span className="text-xs text-muted">👥 旅伴：{(t.members || ['我']).join('、')}</span>
                                <button
                                  onClick={() => setActiveTripId(t.id)}
                                  className="bg-deep hover:bg-accent text-white text-xs font-bold px-4 py-2 rounded-xl transition-colors"
                                >
                                  打開行程 & 匯出 →
                                </button>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}

            {/* 🛍️ 分頁 5：購物 */}
            {activeTab === 'shop' && (
              <div className="space-y-5 animate-fade-in">
                <div className="flex flex-col sm:flex-row sm:items-end justify-between gap-3">
                  <div>
                    <p className="text-[11px] font-bold uppercase tracking-widest text-gold">SHOPPING & WISHLIST</p>
                    <h1 className="text-2xl font-serif font-bold text-deep mt-0.5">🛍️ 娜娜的購物戰利品圖鑑</h1>
                    <p className="text-xs text-muted mt-1">在 LINE 輸入「買起來！！」即可傳送商品圖片建檔，支援蝦皮一鍵比價與分類管理。</p>
                  </div>
                  <select
                    value={shopCategory}
                    onChange={e => setShopCategory(e.target.value)}
                    className="bg-white border border-line rounded-xl px-3.5 py-2.5 text-xs text-ink font-bold self-start"
                  >
                    <option value="">📦 全部商品分類 ({db.shop.length})</option>
                    {((window.categoriesData && window.categoriesData.shop) || []).map((c, idx) => (
                      <option key={`${c.name}_${idx}`} value={c.name}>{c.name} {c.emoji}</option>
                    ))}
                  </select>
                </div>

                {db.shop.filter(x => !shopCategory || x.foodType === shopCategory).length === 0 ? (
                  <div className="editorial-card p-12 text-center text-xs text-muted">
                    目前沒有符合此分類的購物清單喔！
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                    {CardComp && db.shop
                      .filter(x => !shopCategory || x.foodType === shopCategory)
                      .map(item => (
                        <CardComp
                          key={item.uid}
                          item={item}
                          onUpdateNote={handleUpdateNote}
                          onUpdateCategory={handleUpdateCategory}
                          onDelete={handleDeleteItem}
                        />
                      ))}
                  </div>
                )}
              </div>
            )}

          </main>

          {showImportModal && (
            <div className="fixed inset-0 bg-deep/60 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-lg text-deep">✨ 貼文 / 網址 AI 智慧多店匯入</h3>
                  <button onClick={() => setShowImportModal(false)} className="text-muted">✕</button>
                </div>
                <p className="text-xs text-muted leading-relaxed">
                  除了直接分享給 LINE 機器人之外，你也可以在這裡貼上 Threads / 小紅書網址或整篇美食旅遊貼文，後端 Gemini AI 會自動擷取裡面所有的餐廳與景點、查好 Google 圖片並寫入雲端試算表！
                </p>
                <textarea
                  rows="5"
                  placeholder="在此貼上貼文網址或文字內容（支援一次多間店）..."
                  value={importText}
                  onChange={e => setImportText(e.target.value)}
                  className="w-full bg-paper border border-line rounded-2xl p-3.5 text-xs text-ink outline-none"
                />
                <div className="flex justify-end gap-2">
                  <button onClick={() => setShowImportModal(false)} className="px-4 py-2 rounded-xl text-xs font-bold text-muted">取消</button>
                  <button
                    onClick={handleWebImportSubmit}
                    disabled={isImporting}
                    className="px-5 py-2.5 rounded-xl text-xs font-bold bg-accent text-white disabled:opacity-50"
                  >
                    {isImporting ? '🤖 AI 正在辨識並抓取 Google 照片中...' : '開始 AI 辨識收錄'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {toastMsg && (
            <div className="fixed bottom-20 left-1/2 -translate-x-1/2 z-50 bg-deep text-white text-xs font-bold px-5 py-3 rounded-2xl shadow-xl border border-white/15 animate-fade-in">
              {toastMsg}
            </div>
          )}

          <nav className="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-line shadow-[0_-8px_30px_rgba(16,45,50,0.06)] px-2 py-1.5 pb-[calc(6px+env(safe-area-inset-bottom))]">
            <div className="max-w-md mx-auto grid grid-cols-5 items-center gap-1">
              <button
                onClick={() => { setActiveTab('home'); setActiveTripId(null); window.scrollTo(0,0); }}
                className={`flex flex-col items-center py-1.5 rounded-xl transition-colors ${activeTab === 'home' ? 'text-accent bg-soft font-bold' : 'text-muted hover:text-deep font-medium'}`}
              >
                <span className="text-lg leading-none">🏠</span>
                <span className="text-[11px] mt-1">首頁</span>
              </button>

              <button
                onClick={() => { setActiveTab('saved'); window.scrollTo(0,0); }}
                className={`flex flex-col items-center py-1.5 rounded-xl transition-colors ${activeTab === 'saved' ? 'text-accent bg-soft font-bold' : 'text-muted hover:text-deep font-medium'}`}
              >
                <span className="text-lg leading-none">⭐</span>
                <span className="text-[11px] mt-1">收藏</span>
              </button>

              <div className="flex justify-center">
                <button
                  onClick={() => { setActiveTab('createTrip'); window.scrollTo(0,0); }}
                  className={`w-12 h-12 rounded-2xl flex items-center justify-center text-xl font-bold shadow-md transition-transform active:scale-95 ${activeTab === 'createTrip' ? 'bg-accent text-white ring-4 ring-soft' : 'bg-deep text-[#e3c38f] hover:bg-accent hover:text-white'}`}
                  title="建立新行程並匯入收藏"
                >
                  ＋
                </button>
              </div>

              <button
                onClick={() => { setActiveTab('trips'); window.scrollTo(0,0); }}
                className={`flex flex-col items-center py-1.5 rounded-xl transition-colors ${activeTab === 'trips' ? 'text-accent bg-soft font-bold' : 'text-muted hover:text-deep font-medium'}`}
              >
                <span className="text-lg leading-none">🗓️</span>
                <span className="text-[11px] mt-1">行程</span>
              </button>

              <button
                onClick={() => { setActiveTab('shop'); window.scrollTo(0,0); }}
                className={`flex flex-col items-center py-1.5 rounded-xl transition-colors ${activeTab === 'shop' ? 'text-accent bg-soft font-bold' : 'text-muted hover:text-deep font-medium'}`}
              >
                <span className="text-lg leading-none">🛍️</span>
                <span className="text-[11px] mt-1">購物</span>
              </button>
            </div>
          </nav>
        </div>
      );
    }

    function bootApp(retries = 60) {
      if (window.CollectionCard) {
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
      } else if (retries > 0) {
        setTimeout(() => bootApp(retries - 1), 50);
      } else {
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
      }
    }
    bootApp();
  </script>
</body>
</html>
